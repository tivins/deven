<Macro Site $host $docroot>
    <VirtualHost *:80>
        ServerName $host
        DocumentRoot $docroot
        <Directory $docroot>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/$host-error.log
        CustomLog ${APACHE_LOG_DIR}/$host-access.log combined
    </VirtualHost>
</Macro>